plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.10'
  id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.dimitryivaniuta'
version = '0.1.0'
description = 'Secure chargeback/dispute workflow service with RBAC, audit trail, deadlines and attachment metadata.'

java {
  toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'

  implementation 'org.springframework.kafka:spring-kafka'

  // Presigned URL support (S3)
  implementation platform('software.amazon.awssdk:bom:2.27.24')
  implementation 'software.amazon.awssdk:s3'
  implementation 'software.amazon.awssdk:s3-presigner'

  implementation 'org.flywaydb:flyway-core'
  runtimeOnly 'org.postgresql:postgresql'

  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.security:spring-security-test'
  testImplementation 'org.springframework.kafka:spring-kafka-test'
  testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
  testImplementation 'org.testcontainers:postgresql:1.20.4'
  testImplementation 'org.testcontainers:kafka:1.20.4'
  testImplementation 'com.redis:testcontainers-redis:1.6.4'
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
}

bootJar {
  archiveFileName = 'chargeback-dispute-workflow.jar'
}
